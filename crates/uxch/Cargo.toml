[package]
name = "uxch"
description = "A single-threaded Rust matching engine"
edition.workspace = true
version.workspace = true

[dependencies]
uxch-core = { workspace = true, features = ["serde"] }
uxch-ingress.workspace = true
uxch-egress.workspace = true
uxch-risk.workspace = true
uxch-harness.workspace = true

[dev-dependencies]
libtest-mimic = "0.8"
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[[test]]
name = "matches"
harness = false
